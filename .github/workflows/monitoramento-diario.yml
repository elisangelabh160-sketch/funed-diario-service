name: Monitoramento Diário Oficial FUNED

on:
  schedule:
    # 11:07 UTC = 08:07 horário de Brasília (BRT, UTC-3 o ano todo, sem
    # horário de verão), de terça a sábado.
    # OBS: de propósito NÃO é "0 11" (hora cheia) — o próprio GitHub recomenda
    # evitar agendar exatamente no minuto 0, porque é o horário de maior
    # concorrência entre todos os workflows agendados da plataforma, e nesse
    # pico o disparo pode atrasar bastante ou até ser descartado. Alguns
    # minutos de diferença já reduz bastante esse risco.
    # Ajuste o horário aqui se precisar (lembre-se: o valor é sempre em UTC).
    - cron: "7 11 * * 2-6"
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitoramento e enviar e-mail
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: python main.py

name: Monitoramento Diário Oficial FUNED

on:
  # O agendamento interno do GitHub Actions ("schedule") foi removido de
  # propósito: no plano gratuito, o GitHub não garante o horário do disparo
  # agendado — já vimos atrasos de até 50+ minutos e dias em que ele
  # simplesmente não disparou. Por isso, agora o disparo diário é feito por
  # um serviço externo (ex: cron-job.org), que chama a API do GitHub num
  # horário fixo e confiável para rodar este workflow via workflow_dispatch
  # (o mesmo mecanismo do botão "Run workflow"). Ver instruções de
  # configuração enviadas junto com este arquivo.
  workflow_dispatch: {}  # permite rodar manualmente (botão) OU via API externa

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar monitoramento e enviar e-mail
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: python main.py
